version: '3.8'

services:
  # The MongoDB database container
  mongo:
    image: mongo:latest
    container_name: mern_db
    ports:
      - "27017:27017" # Maps localhost:27017 to the container's 27017
    volumes:
      - mongo-data:/data/db # Makes database data persistent so it doesn't wipe on restart
    restart: always

  # The Node.js Express backend container
  backend:
    build: 
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: mern_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/iyan
      - PORT=5000
    volumes:
      - ./mongodb/uploads:/app/uploads # Maps the uploads folder to local to view uploaded images
    depends_on:
      - mongo # Wait for the DB to start before starting the backend
    restart: always

  # The React frontend container
  frontend:
    build:
      context: ./react_frontend
      dockerfile: Dockerfile
    container_name: mern_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      # This handles resolving React hot-reloading in some tricky Docker setups
      - WDS_SOCKET_PORT=0
    stdin_open: true # Equivalent to -i
    tty: true # Equivalent to -t
    depends_on:
      - backend # Start frontend after the backend is ready

volumes:
  mongo-data:
